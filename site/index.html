<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="AI 입문부터 AI Champion까지 — 렛츠코딩의 AI·AX 교육 컨설팅 여정을 스크롤로 체험해보세요">
<meta property="og:title" content="Let's Coding — AI 챔피언으로 가는 여정">
<meta property="og:description" content="AI 입문부터 AI Champion까지, 스크롤로 떠나는 미니어처 세계 여행">
<meta property="og:type" content="website">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --mint: #3EE6C8;
    --mint-deep: #0FBFA0;
    --ink: #1d1d1f;
    --paper: #f5f5f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--paper);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
  }

  /* ── 영상 스테이지 ─────────────────────────── */
  #stage { position: fixed; inset: 0; }
  #stage video, #stage img.fallback {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #stage video { opacity: 0; transition: opacity .2s linear; }
  #stage video.live { opacity: 1; }

  /* ── 상단 브랜드 ──────────────────────────── */
  header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 28px 44px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 30;
  }
  .brand {
    font-size: 20px; font-weight: 800; letter-spacing: -0.02em;
    color: var(--ink);
    text-shadow: 0 1px 8px rgba(255,255,255,.6);
  }
  .brand b { color: var(--mint-deep); }
  .stage-label {
    font-size: 13px; font-weight: 600; letter-spacing: .08em;
    color: rgba(29,29,31,.55);
    text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(255,255,255,.6);
  }

  /* ── 장면 카피 오버레이 ────────────────────── */
  .copy {
    position: fixed; left: 44px; bottom: 64px; z-index: 20;
    max-width: 560px;
    word-break: keep-all;
    opacity: 0; transform: translateY(14px);
    transition: opacity .7s ease, transform .7s ease;
    pointer-events: none;
  }
  .copy.show { opacity: 1; transform: none; pointer-events: auto; }
  .copy .chip {
    display: inline-block;
    font-size: 13px; font-weight: 700; letter-spacing: .02em;
    color: #04443a;
    background: color-mix(in srgb, var(--mint) 85%, white);
    border-radius: 999px;
    padding: 7px 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 14px rgba(15,191,160,.35);
  }
  .copy h2 {
    font-size: clamp(34px, 4vw, 52px);
    font-weight: 800; line-height: 1.16; letter-spacing: -0.03em;
    margin-bottom: 12px;
    text-shadow: 0 1px 2px rgba(255,255,255,.65), 0 6px 28px rgba(255,255,255,.5);
  }
  .copy p {
    font-size: 18px; font-weight: 500; line-height: 1.5;
    color: rgba(29,29,31,.72);
    text-shadow: 0 1px 10px rgba(255,255,255,.7);
  }
  .copy .cta {
    display: inline-block; margin-top: 22px;
    font-size: 17px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--mint-deep), #0aa78c);
    border-radius: 999px; padding: 14px 34px;
    text-decoration: none;
    box-shadow: 0 8px 26px rgba(15,191,160,.45);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .copy .cta:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(15,191,160,.55); }

  /* ── 진행 표시 점 ─────────────────────────── */
  nav#dots {
    position: fixed; right: 34px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 14px; z-index: 30;
  }
  #dots button {
    width: 10px; height: 10px; border-radius: 50%;
    border: none; cursor: pointer;
    background: rgba(29,29,31,.25);
    transition: background .3s, transform .3s;
  }
  #dots button.on { background: var(--mint-deep); transform: scale(1.35); }

  /* ── 스크롤 힌트 ─────────────────────────── */
  #hint {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    font-size: 13px; font-weight: 600; color: rgba(29,29,31,.5);
    z-index: 20; text-shadow: 0 1px 8px rgba(255,255,255,.7);
    animation: bob 2.2s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: translate(-50%, 6px); } }
  #hint.hide { display: none; }
</style>
</head>
<body>

<div id="stage">
  <img class="fallback" id="fallbackImg" alt="">
  <video id="vA" muted playsinline preload="auto"></video>
  <video id="vB" muted playsinline preload="auto"></video>
</div>

<header>
  <div class="brand">Let's <b>Coding</b></div>
  <div class="stage-label" id="stageLabel"></div>
</header>

<section class="copy" id="copy1">
  <span class="chip">AI 기본 체험</span>
  <p>ChatGPT와 Claude, 내 업무의 새로운 동료를 만나다</p>
</section>
<section class="copy" id="copy2">
  <span class="chip">루틴 작업을 자동화</span>
  <h2>개인 생산성 향상 및 시간 절약</h2>
  <p>Claude Code, Codex 활용</p>
</section>
<section class="copy" id="copy3">
  <span class="chip">AI Explorer</span>
  <h2>새로운 활용법을 실험하는 탐험가</h2>
  <p>자신만의 업무 유즈케이스 발굴</p>
</section>
<section class="copy" id="copy4">
  <span class="chip">AI Champion</span>
  <h2>인공지능으로 조직을 이끌다</h2>
  <p>압도적 성과 창출 및 리더십 발휘</p>
</section>
<section class="copy" id="copy5">
  <h2>렛츠코딩과 챔피언으로 성장하세요</h2>
  <a class="cta" href="mailto:turboguy36@gmail.com?subject=Let's Coding 교육 문의">문의하기</a>
</section>

<nav id="dots"></nav>
<div id="hint">스크롤하여 여정 시작</div>

<script>
/* ────────────────────────────────────────────────
   자산 체인: D1 C1 D2 C2 D3 C3 D4 C4 D5
   settled(i) = Di의 마지막 프레임 (장면 i 내부)
   ↓ 스크롤: Ci → D(i+1) 재생   ↑ 스크롤: rDi → rC(i-1) 재생
   r*.mp4 = ffmpeg로 뒤집은 역방향 클립
──────────────────────────────────────────────── */
const V = '../assets/videos/';
const SCENES = [
  { dive: 'd1.mp4', rdive: 'rd1.mp4', conn: 'c1.mp4', rconn: 'rc1.mp4', label: 'AI Novices' },
  { dive: 'd2.mp4', rdive: 'rd2.mp4', conn: 'c2.mp4', rconn: 'rc2.mp4', label: 'AI Optimisers' },
  { dive: 'd3.mp4', rdive: 'rd3.mp4', conn: 'c3.mp4', rconn: 'rc3.mp4', label: 'AI Explorers' },
  { dive: 'd4.mp4', rdive: 'rd4.mp4', conn: 'c4.mp4', rconn: 'rc4.mp4', label: 'AI Champions' },
  { dive: 'd5.mp4', rdive: 'rd5.mp4', conn: null,     rconn: null,      label: "Let's Coding" },
];
const SPEED = 1.25;           // 전환 체감 속도
const vA = document.getElementById('vA');
const vB = document.getElementById('vB');
const hint = document.getElementById('hint');
const stageLabel = document.getElementById('stageLabel');
let cur = 0;                  // 현재 장면 index (0~4)
let busy = false;
let started = false;
let front = vA, back = vB;

const dots = document.getElementById('dots');
SCENES.forEach((s, i) => {
  const b = document.createElement('button');
  b.title = s.label;
  b.onclick = () => goTo(i);
  dots.appendChild(b);
});

function setDots() {
  [...dots.children].forEach((b, i) => b.classList.toggle('on', i === cur));
  stageLabel.textContent = SCENES[cur].label;
}
function showCopy(i) {
  document.querySelectorAll('.copy').forEach(c => c.classList.remove('show'));
  if (i >= 0) document.getElementById('copy' + (i + 1))?.classList.add('show');
}

function playClip(src, onDone) {
  back.src = V + src;
  back.playbackRate = SPEED;
  back.onended = null;
  back.oncanplay = () => {
    back.oncanplay = null;
    back.classList.add('live');
    front.classList.remove('live');
    [front, back] = [back, front];
    front.onended = onDone;
    front.play().catch(() => onDone && onDone());
  };
  back.onerror = () => { console.warn('clip missing:', src); onDone && onDone(); };
  back.load();
}

function playChain(clips, landing) {
  busy = true; showCopy(-1);
  const step = (k) => {
    if (k >= clips.length) { busy = false; cur = landing; setDots(); showCopy(cur); return; }
    playClip(clips[k], () => step(k + 1));
  };
  step(0);
}

function next() {
  if (busy || cur >= SCENES.length - 1) return;
  playChain([SCENES[cur].conn, SCENES[cur + 1].dive], cur + 1);
}
function prev() {
  if (busy || cur <= 0) return;
  playChain([SCENES[cur].rdive, SCENES[cur - 1].rconn], cur - 1);
}
function goTo(i) {
  if (busy || i === cur) return;
  if (i > cur) next(); else prev();   // 순차 이동 (컷 없는 흐름 유지)
}

function start() {
  started = true; hint.classList.add('hide');
  playChain([SCENES[0].dive], 0);
}

let wheelLock = 0;
window.addEventListener('wheel', (e) => {
  const now = Date.now();
  if (now - wheelLock < 400) return;
  wheelLock = now;
  if (!started) return start();
  if (e.deltaY > 12) next();
  else if (e.deltaY < -12) prev();
}, { passive: true });

window.addEventListener('keydown', (e) => {
  if (['ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); started ? next() : start(); }
  if (['ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
});

/* 초기 화면: 장면 1 스틸 → 첫 스크롤에 다이브 시작 */
document.getElementById('fallbackImg').src = '../assets/frames/d1_first.png';
setDots(); showCopy(-1);
</script>
</body>
</html>
