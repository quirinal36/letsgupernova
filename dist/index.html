<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Let's Coding — AI 챔피언으로 가는 여정</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="AI 입문부터 AI Champion까지 — 렛츠코딩의 AI·AX 교육 컨설팅 여정을 스크롤로 체험해보세요">
<meta property="og:title" content="Let's Coding — AI 챔피언으로 가는 여정">
<meta property="og:description" content="AI 입문부터 AI Champion까지, 스크롤로 떠나는 미니어처 세계 여행">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/frames/d1_first.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --mint: #3EE6C8;
    --mint-deep: #0FBFA0;
    --ink: #1d1d1f;
    --paper: #f5f5f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100%;
    overflow-x: hidden;
    background: var(--paper);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
  }

  /* ── 영상 스테이지 ─────────────────────────── */
  #stage { position: fixed; inset: 0; }
  #stage video, #stage img.fallback {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #stage video { opacity: 1; }
  /* 고정된 영상 위를 실제 문서가 스크롤한다. */
  #scrollTrack { height: 900vh; pointer-events: none; }

  /* ── 상단 브랜드 ──────────────────────────── */
  header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 28px 44px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 30;
  }
  .brand {
    font-size: 20px; font-weight: 800; letter-spacing: -0.02em;
    color: var(--ink);
    text-shadow: 0 1px 8px rgba(255,255,255,.6);
  }
  .brand b { color: var(--mint-deep); }
  .stage-label {
    font-size: 13px; font-weight: 600; letter-spacing: .08em;
    color: rgba(29,29,31,.55);
    text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(255,255,255,.6);
  }

  /* ── 장면 카피 오버레이 ────────────────────── */
  .copy {
    position: fixed; left: 44px; bottom: 64px; z-index: 20;
    max-width: 560px;
    word-break: keep-all;
    opacity: 0; transform: translateY(14px);
    transition: opacity .7s ease, transform .7s ease;
    pointer-events: none;
  }
  .copy.show { opacity: 1; transform: none; pointer-events: auto; }
  .copy .chip {
    display: inline-block;
    font-size: 13px; font-weight: 700; letter-spacing: .02em;
    color: #04443a;
    background: color-mix(in srgb, var(--mint) 85%, white);
    border-radius: 999px;
    padding: 7px 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 14px rgba(15,191,160,.35);
  }
  .copy h2 {
    font-size: clamp(34px, 4vw, 52px);
    font-weight: 800; line-height: 1.16; letter-spacing: -0.03em;
    margin-bottom: 12px;
    text-shadow: 0 1px 2px rgba(255,255,255,.65), 0 6px 28px rgba(255,255,255,.5);
  }
  .copy p {
    font-size: 18px; font-weight: 500; line-height: 1.5;
    color: rgba(29,29,31,.72);
    text-shadow: 0 1px 10px rgba(255,255,255,.7);
  }
  .copy .cta {
    display: inline-block; margin-top: 22px;
    font-size: 17px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--mint-deep), #0aa78c);
    border-radius: 999px; padding: 14px 34px;
    text-decoration: none;
    box-shadow: 0 8px 26px rgba(15,191,160,.45);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .copy .cta:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(15,191,160,.55); }

  /* ── 진행 표시 점 ─────────────────────────── */
  nav#dots {
    position: fixed; right: 34px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 14px; z-index: 30;
  }
  #dots button {
    width: 10px; height: 10px; border-radius: 50%;
    border: none; cursor: pointer;
    background: rgba(29,29,31,.25);
    transition: background .3s, transform .3s;
  }
  #dots button.on { background: var(--mint-deep); transform: scale(1.35); }

  /* ── 스크롤 힌트 ─────────────────────────── */
  #hint {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    font-size: 13px; font-weight: 600; color: rgba(29,29,31,.5);
    z-index: 20; text-shadow: 0 1px 8px rgba(255,255,255,.7);
    animation: bob 2.2s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: translate(-50%, 6px); } }
  #hint.hide { display: none; }
</style>
</head>
<body>

<div id="stage">
  <video id="scrollVideo" muted playsinline preload="auto" poster="assets/frames/d1_first.png"></video>
</div>

<header>
  <div class="brand">Let's <b>Coding</b></div>
  <div class="stage-label" id="stageLabel"></div>
</header>

<section class="copy" id="copy1">
  <span class="chip">AI 기본 체험</span>
  <p>ChatGPT와 Claude, 내 업무의 새로운 동료를 만나다</p>
</section>
<section class="copy" id="copy2">
  <span class="chip">루틴 작업을 자동화</span>
  <h2>개인 생산성 향상 및 시간 절약</h2>
  <p>Claude Code, Codex 활용</p>
</section>
<section class="copy" id="copy3">
  <span class="chip">AI Explorer</span>
  <h2>새로운 활용법을 실험하는 탐험가</h2>
  <p>자신만의 업무 유즈케이스 발굴</p>
</section>
<section class="copy" id="copy4">
  <span class="chip">AI Champion</span>
  <h2>인공지능으로 조직을 이끌다</h2>
  <p>압도적 성과 창출 및 리더십 발휘</p>
</section>
<section class="copy" id="copy5">
  <h2>렛츠코딩과 챔피언으로 성장하세요</h2>
  <a class="cta" href="mailto:turboguy36@gmail.com?subject=Let's Coding 교육 문의">문의하기</a>
</section>

<nav id="dots"></nav>
<div id="hint">스크롤하여 여정 시작</div>
<div id="scrollTrack" aria-hidden="true"></div>

<script>
/* 스크롤 위치를 하나의 마스터 영상 시간축에 매핑한다. */
const SCENES = [
  { label: 'AI Novices' }, { label: 'AI Optimisers' }, { label: 'AI Explorers' },
  { label: 'AI Champions' }, { label: "Let's Coding" },
];
const video = document.getElementById('scrollVideo');
const hint = document.getElementById('hint');
const stageLabel = document.getElementById('stageLabel');
let cur = -1;
let targetTime = 0;
let renderedTime = 0;
let rafId = 0;
const dots = document.getElementById('dots');
SCENES.forEach((s, i) => {
  const b = document.createElement('button');
  b.title = s.label;
  b.onclick = () => goTo(i);
  dots.appendChild(b);
});
function setDots() {
  [...dots.children].forEach((b, i) => b.classList.toggle('on', i === cur));
  stageLabel.textContent = cur >= 0 ? SCENES[cur].label : '';
}
function showCopy(i) {
  document.querySelectorAll('.copy').forEach(c => c.classList.remove('show'));
  if (i >= 0) document.getElementById('copy' + (i + 1))?.classList.add('show');
}
function goTo(i) {
  const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  window.scrollTo({ top: maxScroll * ((i * 2 + 1) / 9), behavior: 'smooth' });
}
function updateScene(progress) {
  const next = Math.min(SCENES.length - 1, Math.max(0, Math.round((progress * 9 - 1) / 2)));
  if (next !== cur) { cur = next; setDots(); showCopy(cur); }
}
function renderVideo() {
  renderedTime += (targetTime - renderedTime) * 0.22;
  if (Math.abs(targetTime - renderedTime) < 0.005) renderedTime = targetTime;
  if (Math.abs(video.currentTime - renderedTime) > 0.012) video.currentTime = renderedTime;
  if (renderedTime !== targetTime) rafId = requestAnimationFrame(renderVideo);
  else rafId = 0;
}
function syncToScroll() {
  if (!Number.isFinite(video.duration)) return;
  const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  const progress = maxScroll > 0 ? Math.min(1, Math.max(0, window.scrollY / maxScroll)) : 0;
  targetTime = progress * video.duration;
  updateScene(progress);
  hint.classList.toggle('hide', progress > 0.015);
  if (!rafId) rafId = requestAnimationFrame(renderVideo);
}
video.addEventListener('loadedmetadata', syncToScroll);
window.addEventListener('scroll', syncToScroll, { passive: true });
window.addEventListener('resize', syncToScroll);
video.src = 'assets/videos/scroll-master.mp4';
setDots(); showCopy(-1);
</script>
</body>
</html>
